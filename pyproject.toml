[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory_demo"
version = "0.1.0"
description = "Uni-Lab-OS 库存演示设备包：试剂入库、按数量预留与出库扣减、数量不足拒绝"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["inventory_demo*"]

[tool.setuptools.data-files]
"share/inventory_demo/graph" = ["graph/*.json"]
